<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Laberinto del corazón</title>
  <style>
    :root {
      --bg1: #ffe4ec;
      --bg2: #fff2f7;
      --bg3: #fce7ff;
      --card: rgba(255, 255, 255, 0.88);
      --card-strong: rgba(255, 255, 255, 0.94);
      --border: rgba(255, 255, 255, 0.85);
      --rose-100: #ffe4ec;
      --rose-200: #fecdd9;
      --rose-300: #f9a8bf;
      --rose-400: #fb7185;
      --rose-500: #f43f5e;
      --pink-50: #fdf2f8;
      --fuchsia-100: #fae8ff;
      --text: #334155;
      --text-soft: #64748b;
      --success-bg: #ecfdf5;
      --success-text: #047857;
      --danger-bg: #fef2f2;
      --danger-text: #b91c1c;
      --shadow: 0 24px 50px rgba(244, 63, 94, 0.12);
      --shadow-soft: 0 10px 28px rgba(244, 63, 94, 0.09);
      --cell: 26px;
      --radius-xl: 28px;
      --radius-lg: 22px;
      --radius-md: 16px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 45%, var(--bg3) 100%);
      overscroll-behavior: none;
    }

    body {
      padding: 16px;
    }

    .app {
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-bottom: 24px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      overflow: hidden;
    }

    .card-inner {
      padding: 18px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: flex-start;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--rose-500);
      background: var(--rose-100);
      border-radius: 999px;
      padding: 8px 12px;
      font-weight: 700;
    }

    .icon-pill {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      background: var(--rose-100);
      border-radius: 18px;
      font-size: 24px;
      flex-shrink: 0;
    }

    h1, h2, h3, p { margin: 0; }

    .title {
      margin-top: 8px;
      font-size: 28px;
      line-height: 1.05;
      font-weight: 800;
      color: #1f2937;
    }

    .subtitle {
      margin-top: 6px;
      font-size: 14px;
      color: var(--text-soft);
      line-height: 1.5;
    }

    .stats-grid {
      margin-top: 16px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .stat {
      background: rgba(255, 228, 236, 0.68);
      border-radius: 18px;
      padding: 12px;
      text-align: center;
    }

    .stat-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-soft);
    }

    .stat-value {
      margin-top: 4px;
      font-weight: 800;
      font-size: 14px;
      color: #1f2937;
    }

    .level-box {
      margin-top: 14px;
      background: linear-gradient(90deg, #fff1f5, #fdf4ff);
      border-radius: 22px;
      padding: 14px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.5);
    }

    .level-title {
      font-size: 15px;
      font-weight: 800;
      color: #1f2937;
    }

    .level-intro {
      margin-top: 8px;
      font-size: 14px;
      line-height: 1.65;
      color: var(--text-soft);
    }

    .progress-wrap {
      margin-top: 16px;
      display: grid;
      gap: 8px;
    }

    .progress-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-soft);
    }

    .progress-bar {
      height: 9px;
      border-radius: 999px;
      background: #ffe4ec;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      transition: width 160ms linear;
      background: var(--rose-400);
    }

    .progress-fill.total {
      background: #d946ef;
    }

    .board-card .card-inner {
      padding: 14px;
    }

    .board-shell {
      position: relative;
      margin: 0 auto;
      padding: 8px;
      touch-action: none;
      border-radius: 24px;
      border: 4px solid rgba(255, 228, 236, 0.95);
      background: #fff7fb;
      box-shadow: inset 0 8px 20px rgba(244, 63, 94, 0.08);
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    .board-grid {
      position: relative;
      display: grid;
      gap: 0;
    }

    .tile {
      width: var(--cell);
      height: var(--cell);
      display: grid;
      place-items: center;
      border-radius: 7px;
      font-size: 13px;
    }

    .wall {
      background: rgba(249, 168, 191, 0.95);
    }

    .floor {
      background: rgba(255, 255, 255, 0.84);
    }

    .entities-layer {
      position: absolute;
      left: 8px;
      top: 8px;
      pointer-events: none;
    }

    .entity {
      position: absolute;
      width: var(--cell);
      height: var(--cell);
      display: grid;
      place-items: center;
      font-size: 18px;
      will-change: transform;
      filter: drop-shadow(0 4px 6px rgba(244, 63, 94, 0.18));
    }

    .message-box {
      margin-top: 14px;
      border-radius: 18px;
      padding: 14px;
      font-size: 14px;
      line-height: 1.6;
    }

    .message-info {
      background: #fff1f5;
      color: #475569;
    }

    .message-boost {
      background: #fffbeb;
      color: #92400e;
    }

    .message-success {
      background: var(--success-bg);
      color: var(--success-text);
      text-align: center;
    }

    .message-danger {
      background: var(--danger-bg);
      color: var(--danger-text);
      text-align: center;
    }

    .message-title {
      font-weight: 800;
      margin-bottom: 6px;
    }

    .actions {
      margin-top: 14px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .button,
    .control-btn,
    .wide-button {
      border: 0;
      outline: none;
      cursor: pointer;
      transition: transform 120ms ease, opacity 120ms ease, filter 120ms ease;
      font: inherit;
    }

    .button:active,
    .control-btn:active,
    .wide-button:active {
      transform: scale(0.98);
    }

    .button {
      min-height: 50px;
      border-radius: 18px;
      padding: 12px 14px;
      background: linear-gradient(180deg, #fb7185, #f43f5e);
      color: white;
      font-weight: 800;
      box-shadow: var(--shadow-soft);
    }

    .button.secondary,
    .control-btn,
    .wide-button.secondary {
      background: rgba(255,255,255,0.86);
      color: #334155;
      border: 1px solid rgba(244, 63, 94, 0.08);
    }

    .button[disabled],
    .control-btn[disabled],
    .wide-button[disabled] {
      opacity: 0.55;
      cursor: default;
      transform: none;
      filter: grayscale(0.08);
    }

    .wide-button {
      margin-top: 10px;
      width: 100%;
      min-height: 50px;
      border-radius: 18px;
      padding: 12px 16px;
      background: linear-gradient(180deg, #fb7185, #f43f5e);
      color: white;
      font-weight: 800;
      box-shadow: var(--shadow-soft);
    }

    .controls-card .card-inner {
      padding: 16px;
    }

    .controls-title {
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 10px;
    }

    .controls-grid {
      width: 210px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .control-btn {
      height: 48px;
      border-radius: 18px;
      font-size: 18px;
      display: grid;
      place-items: center;
      box-shadow: var(--shadow-soft);
    }

    .placeholder {
      visibility: hidden;
    }

    .final-shell {
      margin-top: 14px;
      padding: 1px;
      border-radius: 28px;
      background: linear-gradient(135deg, #ffe4ec, #fff1f5, #fae8ff);
      box-shadow: var(--shadow-soft);
      overflow: hidden;
    }

    .final-card {
      border-radius: 27px;
      padding: 20px 18px;
      background: rgba(255,255,255,0.9);
      text-align: center;
      backdrop-filter: blur(10px);
      position: relative;
      overflow: hidden;
    }

    .hearts-bg {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      opacity: 0.85;
    }

    .heart-float {
      position: absolute;
      bottom: -24px;
      font-size: 18px;
      animation: floatUp linear infinite;
      filter: drop-shadow(0 4px 8px rgba(244,63,94,0.16));
    }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.9); opacity: 0; }
      10% { opacity: 1; }
      100% { transform: translateY(-320px) scale(1.08); opacity: 0; }
    }

    .final-top-icons {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      color: var(--rose-500);
      font-size: 18px;
    }

    .final-center {
      position: relative;
      z-index: 1;
      margin: 14px auto 16px;
      width: 84px;
      height: 84px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #fecdd9, #f5d0fe);
      box-shadow: inset 0 2px 8px rgba(255,255,255,0.7);
    }

    .final-center-inner {
      width: 64px;
      height: 64px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,0.85);
      font-size: 32px;
      box-shadow: 0 6px 18px rgba(244,63,94,0.14);
    }

    .final-badge {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 999px;
      background: #fff1f5;
      color: var(--rose-500);
      padding: 8px 14px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      font-weight: 800;
    }

    .final-title {
      position: relative;
      z-index: 1;
      margin-top: 12px;
      font-size: 30px;
      font-weight: 800;
      color: #1f2937;
    }

    .final-text {
      position: relative;
      z-index: 1;
      margin-top: 12px;
      font-size: 16px;
      line-height: 1.8;
      color: #881337;
    }

    .final-note {
      position: relative;
      z-index: 1;
      margin-top: 16px;
      padding: 16px;
      border-radius: 22px;
      background: linear-gradient(90deg, #fff1f5, #fdf4ff);
      text-align: left;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.6);
    }

    .final-note p {
      font-size: 14px;
      line-height: 1.8;
      color: #475569;
    }

    .final-note p + p {
      margin-top: 12px;
    }

    .final-stats {
      position: relative;
      z-index: 1;
      margin-top: 14px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      text-align: center;
    }

    .final-stat {
      border-radius: 18px;
      padding: 12px 8px;
      background: #fff1f5;
    }

    .final-quote {
      position: relative;
      z-index: 1;
      margin-top: 16px;
      font-size: 14px;
      line-height: 1.7;
      font-style: italic;
      color: #be185d;
    }

    @media (max-width: 390px) {
      body { padding: 12px; }
      .title { font-size: 25px; }
      .final-title { font-size: 27px; }
      .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <div class="app">
    <section class="card">
      <div class="card-inner">
        <div class="header-top">
          <div>
            <div class="badge">⚡ juego para Geraldine · tiempo real</div>
            <h1 class="title">Laberinto del corazón</h1>
            <p class="subtitle">Movimiento fluido, controles instantáneos y cuatro niveles románticos.</p>
          </div>
          <div class="icon-pill">💖</div>
        </div>

        <div class="stats-grid">
          <div class="stat"><div class="stat-label">Nivel</div><div class="stat-value" id="stat-level">1/4</div></div>
          <div class="stat"><div class="stat-label">Corazones</div><div class="stat-value" id="stat-hearts">0/0</div></div>
          <div class="stat"><div class="stat-label">Vidas</div><div class="stat-value" id="stat-lives">💗💗💗</div></div>
          <div class="stat"><div class="stat-label">Total</div><div class="stat-value" id="stat-total">0</div></div>
        </div>

        <div class="level-box">
          <div class="level-title" id="level-title"></div>
          <p class="level-intro" id="level-intro"></p>
        </div>

        <div class="progress-wrap">
          <div class="progress-row"><span>Progreso del nivel</span><span id="level-progress-text">0%</span></div>
          <div class="progress-bar"><div class="progress-fill" id="level-progress-fill"></div></div>
          <div class="progress-row"><span>Progreso total</span><span id="total-progress-text">0%</span></div>
          <div class="progress-bar" style="background:#fae8ff;"><div class="progress-fill total" id="total-progress-fill"></div></div>
        </div>
      </div>
    </section>

    <section class="card board-card">
      <div class="card-inner">
        <div class="board-shell" id="board-shell">
          <div class="board-grid" id="board-grid"></div>
          <div class="entities-layer" id="entities-layer"></div>
        </div>

        <div id="message-container"></div>

        <div class="actions">
          <button class="button" id="play-btn">▶ Jugar</button>
          <button class="button secondary" id="reset-btn">↺ Reiniciar</button>
        </div>

        <button class="wide-button" id="next-level-btn" style="display:none;">→ Siguiente nivel</button>
      </div>
    </section>

    <section class="card controls-card">
      <div class="card-inner">
        <div class="controls-title">Controles</div>
        <div class="controls-grid">
          <div class="placeholder">·</div>
          <button class="control-btn" data-dir="up">↑</button>
          <div class="placeholder">·</div>
          <button class="control-btn" data-dir="left">←</button>
          <button class="control-btn" data-dir="down">↓</button>
          <button class="control-btn" data-dir="right">→</button>
        </div>
      </div>
    </section>
  </div>

  <script>
    const CELL = 26;
    const INITIAL_LIVES = 8;
    const BOOST_DURATION = 15000;
    const PLAYER_SPEEDS = [118, 108, 100, 94];
    const GHOST_SPEEDS = [360, 330, 300, 270];

    const LEVELS = [
      {
        title: "Nivel 1 · Primer latido",
        intro: "Geraldine, todo empieza suave: recoge los primeros corazones y deja que esta aventura te recuerde lo fácil que es sonreír cuando pienso en ti.",
        clearMessage: "Pasaste el primer nivel, Geraldine. Así se siente gustarte: un corazón detrás de otro, sin querer detenerme.",
        map: [
          "#############",
          "#P...#.....G#",
          "#.##.#.###..#",
          "#....#...#..#",
          "#.####.#.#.##",
          "#......#....#",
          "###.#####.###",
          "#...#...#...#",
          "#.#.#.#.#.#.#",
          "#.#...#...#.#",
          "#.#####.###.#",
          "#G....*.....#",
          "#############",
        ],
      },
      {
        title: "Nivel 2 · Miradas que se quedan",
        intro: "Ahora el camino se pone más intenso, como cuando te miro un poquito más de la cuenta. Geraldine, sigues siendo mi parte favorita del juego.",
        clearMessage: "Segundo nivel superado. Me encantas tanto que hasta este laberinto se siente pequeño comparado con todo lo que provocas en mí.",
        map: [
          "#############",
          "#P..#....#..#",
          "#.#.#.##.#G.#",
          "#.#...##....#",
          "#.###.#######",
          "#.....#.....#",
          "###.#.#.###.#",
          "#...#...#...#",
          "#.#####.#.#.#",
          "#.....#.#.#.#",
          "#.###.#...#.#",
          "#G..*...#...#",
          "#############",
        ],
      },
      {
        title: "Nivel 3 · Promesas suaves",
        intro: "Aquí ya no solo corres por corazones: corres hacia todo lo bonito que me imagino contigo. Geraldine, contigo hasta perderse se siente bien.",
        clearMessage: "Tercer nivel superado. Si esto fuera una promesa, sería esta: seguir eligiéndote incluso cuando el camino tenga vueltas raras.",
        map: [
          "#############",
          "#P....#....G#",
          "#.###.#.###.#",
          "#...#.#...#.#",
          "###.#.###.#.#",
          "#...#.....#.#",
          "#.#####.###.#",
          "#.#...#.....#",
          "#.#.#.#####.#",
          "#...#...#...#",
          "#.#####.#.#.#",
          "#G....*...#.#",
          "#############",
        ],
      },
      {
        title: "Nivel 4 · Destino contigo",
        intro: "Este es el último tramo, Geraldine. Si llegas hasta el final, desbloqueas lo que llevo queriendo decirte: que entre todas las rutas, mi favorita siempre termina en ti.",
        clearMessage: "Último nivel limpio. Ya no quedan fantasmas, solo todo lo bonito que siento cuando tu nombre aparece en mi día.",
        map: [
          "#############",
          "#P..#...#..G#",
          "#.#.#.#.#.#.#",
          "#.#...#...#.#",
          "#.###.###.#.#",
          "#...#.....#.#",
          "###.#.#####.#",
          "#...#...#...#",
          "#.#####.#.###",
          "#.....#.#...#",
          "#.###.#.###.#",
          "#G..*......##",
          "#############",
        ],
      },
    ];

    const DIRECTIONS = {
      up: { x: 0, y: -1 },
      down: { x: 0, y: 1 },
      left: { x: -1, y: 0 },
      right: { x: 1, y: 0 },
    };

    const els = {
      boardShell: document.getElementById('board-shell'),
      boardGrid: document.getElementById('board-grid'),
      entitiesLayer: document.getElementById('entities-layer'),
      statLevel: document.getElementById('stat-level'),
      statHearts: document.getElementById('stat-hearts'),
      statLives: document.getElementById('stat-lives'),
      statTotal: document.getElementById('stat-total'),
      levelTitle: document.getElementById('level-title'),
      levelIntro: document.getElementById('level-intro'),
      levelProgressText: document.getElementById('level-progress-text'),
      totalProgressText: document.getElementById('total-progress-text'),
      levelProgressFill: document.getElementById('level-progress-fill'),
      totalProgressFill: document.getElementById('total-progress-fill'),
      messageContainer: document.getElementById('message-container'),
      playBtn: document.getElementById('play-btn'),
      resetBtn: document.getElementById('reset-btn'),
      nextLevelBtn: document.getElementById('next-level-btn'),
      controlBtns: [...document.querySelectorAll('.control-btn')],
    };

    const state = {
      levelIndex: 0,
      grid: [],
      player: { x: 0, y: 0 },
      ghosts: [],
      totalHearts: 0,
      collected: 0,
      totalCollected: 0,
      lives: INITIAL_LIVES,
      running: false,
      status: 'ready',
      desiredDirection: 'right',
      direction: 'right',
      boostEndAt: 0,
      boostMsLeft: 0,
      playerAccumulator: 0,
      ghostAccumulator: 0,
      lastFrame: 0,
      playerEl: null,
      ghostEls: [],
    };

    function buildLevel(levelIndex) {
      const template = LEVELS[levelIndex].map;
      const grid = template.map(row => row.split(''));
      let player = { x: 1, y: 1 };
      const ghosts = [];
      let totalHearts = 0;

      for (let y = 0; y < grid.length; y++) {
        for (let x = 0; x < grid[y].length; x++) {
          const cell = grid[y][x];
          if (cell === 'P') {
            player = { x, y };
            grid[y][x] = ' ';
          }
          if (cell === 'G') {
            ghosts.push({ x, y, startX: x, startY: y, dir: 'left' });
            grid[y][x] = ' ';
          }
          if (cell === '.' || cell === '*') totalHearts += 1;
        }
      }

      return { grid, player, ghosts, totalHearts };
    }

    function cloneGrid(grid) {
      return grid.map(row => [...row]);
    }

    function isWall(grid, x, y) {
      return grid[y]?.[x] === '#';
    }

    function samePos(a, b) {
      return a.x === b.x && a.y === b.y;
    }

    function nextPosition(pos, dirName) {
      const dir = DIRECTIONS[dirName];
      return { x: pos.x + dir.x, y: pos.y + dir.y };
    }

    function canMove(grid, pos, dirName) {
      const next = nextPosition(pos, dirName);
      return !isWall(grid, next.x, next.y);
    }

    function getValidMoves(grid, entity) {
      return Object.keys(DIRECTIONS).filter(dirName => canMove(grid, entity, dirName));
    }

    function getStepToward(grid, from, target) {
      const options = getValidMoves(grid, from);
      if (!options.length) return from.dir || 'left';

      const scored = options.map(name => {
        const next = nextPosition(from, name);
        const distance = Math.abs(next.x - target.x) + Math.abs(next.y - target.y);
        return { name, distance };
      });

      scored.sort((a, b) => a.distance - b.distance);
      const bestDistance = scored[0].distance;
      const best = scored.filter(item => item.distance === bestDistance);
      if (from.dir && best.some(item => item.name === from.dir)) return from.dir;
      return best[Math.floor(Math.random() * best.length)].name;
    }

    function boardSize() {
      return {
        width: state.grid[0].length * CELL,
        height: state.grid.length * CELL,
      };
    }

    function transitionMs(type) {
      const list = type === 'player' ? PLAYER_SPEEDS : GHOST_SPEEDS;
      return list[state.levelIndex] || list[list.length - 1];
    }

    function syncEntityTransitions() {
      if (state.playerEl) state.playerEl.style.transitionDuration = `${transitionMs('player')}ms`;
      state.ghostEls.forEach(el => { el.style.transitionDuration = `${transitionMs('ghost')}ms`; });
    }

    function moveEntity(el, x, y) {
      el.style.transform = `translate(${x * CELL}px, ${y * CELL}px)`;
    }

    function renderBoard() {
      const size = boardSize();
      els.boardShell.style.width = `${size.width + 16}px`;
      els.boardShell.style.height = `${size.height + 16}px`;
      els.boardGrid.style.width = `${size.width}px`;
      els.boardGrid.style.height = `${size.height}px`;
      els.boardGrid.style.gridTemplateColumns = `repeat(${state.grid[0].length}, ${CELL}px)`;
      els.entitiesLayer.style.width = `${size.width}px`;
      els.entitiesLayer.style.height = `${size.height}px`;

      const html = [];
      for (let y = 0; y < state.grid.length; y++) {
        for (let x = 0; x < state.grid[y].length; x++) {
          const cell = state.grid[y][x];
          const wall = cell === '#';
          let content = '';
          if (cell === '.') content = '💗';
          if (cell === '*') content = '✨';
          html.push(`<div class="tile ${wall ? 'wall' : 'floor'}">${content}</div>`);
        }
      }
      els.boardGrid.innerHTML = html.join('');
    }

    function renderEntities(firstPaint = false) {
      const playerEmoji = state.boostMsLeft > 0 ? '💘' : '🥰';
      const ghostEmoji = state.boostMsLeft > 0 ? '😵' : '👻';

      if (firstPaint || !state.playerEl) {
        els.entitiesLayer.innerHTML = '';
        state.ghostEls = [];

        state.ghosts.forEach((ghost, index) => {
          const ghostEl = document.createElement('div');
          ghostEl.className = 'entity';
          ghostEl.dataset.index = index;
          ghostEl.textContent = ghostEmoji;
          ghostEl.style.transition = `transform ${transitionMs('ghost')}ms linear`;
          moveEntity(ghostEl, ghost.x, ghost.y);
          els.entitiesLayer.appendChild(ghostEl);
          state.ghostEls.push(ghostEl);
        });

        state.playerEl = document.createElement('div');
        state.playerEl.className = 'entity';
        state.playerEl.textContent = playerEmoji;
        state.playerEl.style.transition = `transform ${transitionMs('player')}ms linear`;
        moveEntity(state.playerEl, state.player.x, state.player.y);
        els.entitiesLayer.appendChild(state.playerEl);
      } else {
        state.playerEl.textContent = playerEmoji;
        moveEntity(state.playerEl, state.player.x, state.player.y);

        state.ghosts.forEach((ghost, index) => {
          const ghostEl = state.ghostEls[index];
          if (!ghostEl) return;
          ghostEl.textContent = ghostEmoji;
          moveEntity(ghostEl, ghost.x, ghost.y);
        });
      }
    }

    function heartsMarkup() {
      const items = [
        { left: '8%', delay: '0s', duration: '4.4s', size: '16px' },
        { left: '19%', delay: '0.8s', duration: '5.2s', size: '18px' },
        { left: '31%', delay: '1.4s', duration: '4.8s', size: '20px' },
        { left: '47%', delay: '0.3s', duration: '5.8s', size: '15px' },
        { left: '61%', delay: '1.1s', duration: '4.9s', size: '19px' },
        { left: '76%', delay: '0.5s', duration: '5.5s', size: '17px' },
        { left: '88%', delay: '1.7s', duration: '4.7s', size: '16px' },
      ];
      return items.map(item =>
        `<span class="heart-float" style="left:${item.left};animation-delay:${item.delay};animation-duration:${item.duration};font-size:${item.size};">💗</span>`
      ).join('');
    }

    function renderMessage() {
      const level = LEVELS[state.levelIndex];
      let html = '';

      if (state.status === 'ready') {
        html = `<div class="message-box message-info">Ahora está súper fácil: muchísimas vidas, fantasmas muy lentos y una chispa larguísima para jugar sin presión. Toca jugar y cambia de dirección con botones, teclado o deslizamiento.</div>`;
      }

      if (state.status === 'playing') {
        html = `<div class="message-box message-boost">Chispa activa: ${state.boostMsLeft > 0 ? `${(state.boostMsLeft / 1000).toFixed(1)}s para espantar fantasmas.` : 'todavía no has tomado la chispa especial.'}</div>`;
      }

      if (state.status === 'levelWon') {
        html = `
          <div class="message-box message-success">
            <div class="message-title">🏆 Nivel completado</div>
            <div>${level.clearMessage}</div>
          </div>
        `;
      }

      if (state.status === 'lost') {
        html = `
          <div class="message-box message-danger">
            <div class="message-title">💀 Te atraparon</div>
            <div>Otra vuelta más, Geraldine. Yo también volvería a intentarlo contigo todas las veces necesarias.</div>
          </div>
        `;
      }

      if (state.status === 'gameWon') {
        html = `
          <div class="final-shell">
            <div class="final-card">
              <div class="hearts-bg">${heartsMarkup()}</div>
              <div class="final-top-icons">✨ 💖 ✨</div>
              <div class="final-center"><div class="final-center-inner">💖</div></div>
              <div class="final-badge">🏆 Final desbloqueado</div>
              <div class="final-title">Para Geraldine</div>
              <p class="final-text">
                Llegaste al final de este laberinto, pero la verdad es que mi parte favorita no era ganar,
                sino pensar en ti mientras lo hacía bonito para ti.
              </p>
              <div class="final-note">
                <p>
                  Geraldine, me encantas más de lo que a veces sé explicar. Me gusta tu nombre, me gusta tu forma de existir,
                  y me gusta la idea de seguir encontrándote incluso en mis días más simples.
                </p>
                <p>
                  Si mi corazón tuviera un premio final, serías tú. Si tuviera una meta secreta, también serías tú.
                  Y si tuviera que elegir un lugar bonito para quedarme, sería siempre donde estés tú.
                </p>
              </div>
              <div class="final-stats">
                <div class="final-stat"><div class="stat-label">Niveles</div><div class="stat-value">4/4</div></div>
                <div class="final-stat"><div class="stat-label">Corazones</div><div class="stat-value">${state.totalCollected}</div></div>
                <div class="final-stat"><div class="stat-label">Premio</div><div class="stat-value">Geraldine 💘</div></div>
              </div>
              <div class="final-quote">“Entre todos los caminos posibles, mi favorito siempre termina en ti.”</div>
            </div>
          </div>
        `;
      }

      els.messageContainer.innerHTML = html;
      els.nextLevelBtn.style.display = state.status === 'levelWon' && state.levelIndex < LEVELS.length - 1 ? 'block' : 'none';
      els.playBtn.disabled = ['levelWon', 'gameWon', 'lost'].includes(state.status);
      els.playBtn.textContent = state.running ? '⏸ Pausar' : '▶ Jugar';
    }

    function renderStats() {
      const levelProgress = Math.round((state.collected / Math.max(state.totalHearts, 1)) * 100);
      const totalProgress = Math.round(((state.levelIndex + state.collected / Math.max(state.totalHearts, 1)) / LEVELS.length) * 100);
      const level = LEVELS[state.levelIndex];

      els.statLevel.textContent = `${state.levelIndex + 1}/${LEVELS.length}`;
      els.statHearts.textContent = `${state.collected}/${state.totalHearts}`;
      els.statLives.textContent = state.lives > 0 ? '💗'.repeat(state.lives) : '—';
      els.statTotal.textContent = state.totalCollected;
      els.levelTitle.textContent = level.title;
      els.levelIntro.textContent = level.intro;
      els.levelProgressText.textContent = `${levelProgress}%`;
      els.totalProgressText.textContent = `${totalProgress}%`;
      els.levelProgressFill.style.width = `${levelProgress}%`;
      els.totalProgressFill.style.width = `${totalProgress}%`;
    }

    function renderAll(firstPaint = false) {
      renderBoard();
      renderEntities(firstPaint);
      syncEntityTransitions();
      renderStats();
      renderMessage();
    }

    function stopGame(nextStatus) {
      state.running = false;
      state.status = nextStatus;
      renderMessage();
    }

    function syncBoostDisplay(now) {
      const msLeft = Math.max(0, state.boostEndAt - now);
      const nextBucket = Math.ceil(msLeft / 100);
      if (nextBucket !== Math.ceil(state.boostMsLeft / 100)) {
        state.boostMsLeft = msLeft;
        renderEntities();
        if (state.status === 'playing') renderMessage();
      } else {
        state.boostMsLeft = msLeft;
      }
      if (msLeft <= 0) state.boostEndAt = 0;
      return msLeft > 0;
    }

    function consumeCurrentCell(x, y, now) {
      const cell = state.grid[y]?.[x];
      if (cell !== '.' && cell !== '*') return;

      state.grid = cloneGrid(state.grid);
      state.grid[y][x] = ' ';
      state.collected += 1;
      state.totalCollected += 1;

      if (cell === '*') {
        state.boostEndAt = now + BOOST_DURATION;
        state.boostMsLeft = BOOST_DURATION;
      }

      renderBoard();
      renderStats();
      renderMessage();
    }

    function finishLevelIfNeeded() {
      if (state.collected < state.totalHearts || state.totalHearts === 0) return false;
      stopGame(state.levelIndex === LEVELS.length - 1 ? 'gameWon' : 'levelWon');
      return true;
    }

    function resetPositionsInCurrentLevel() {
      const fresh = buildLevel(state.levelIndex);
      state.player = fresh.player;
      state.ghosts = fresh.ghosts;
      state.direction = 'right';
      state.desiredDirection = 'right';
      state.boostEndAt = 0;
      state.boostMsLeft = 0;
      state.playerAccumulator = 0;
      state.ghostAccumulator = 0;
      state.running = false;
      state.status = 'ready';
      renderEntities(true);
      renderMessage();
      renderStats();
    }

    function handleCollision(now) {
      const hitIndex = state.ghosts.findIndex(ghost => samePos(ghost, state.player));
      if (hitIndex === -1) return;

      const boostActive = state.boostEndAt > now;
      if (boostActive) {
        state.ghosts[hitIndex] = {
          ...state.ghosts[hitIndex],
          x: state.ghosts[hitIndex].startX,
          y: state.ghosts[hitIndex].startY,
          dir: 'left',
        };
        renderEntities();
        return;
      }

      state.lives -= 1;
      renderStats();

      if (state.lives <= 0) {
        stopGame('lost');
        return;
      }

      resetPositionsInCurrentLevel();
    }

    function stepPlayer(now) {
      if (state.status !== 'playing') return;

      if (canMove(state.grid, state.player, state.desiredDirection)) {
        state.direction = state.desiredDirection;
      }

      if (!canMove(state.grid, state.player, state.direction)) return;

      state.player = nextPosition(state.player, state.direction);
      renderEntities();
      consumeCurrentCell(state.player.x, state.player.y, now);
      if (finishLevelIfNeeded()) return;
      handleCollision(now);
    }

    function stepGhosts(now) {
      if (state.status !== 'playing') return;

      const boostActive = state.boostEndAt > now;
      const targetPlayer = state.player;

      state.ghosts = state.ghosts.map(ghost => {
        const options = getValidMoves(state.grid, ghost);
        if (!options.length) return ghost;

        let chosen = ghost.dir;
        if (boostActive) {
          const scored = options.map(name => {
            const next = nextPosition(ghost, name);
            const distance = Math.abs(next.x - targetPlayer.x) + Math.abs(next.y - targetPlayer.y);
            return { name, distance };
          });
          scored.sort((a, b) => b.distance - a.distance);
          chosen = scored[0].name;
        } else {
          chosen = Math.random() < 0.22 ? getStepToward(state.grid, ghost, targetPlayer) : options[Math.floor(Math.random() * options.length)];
        }

        const next = nextPosition(ghost, chosen);
        return { ...ghost, x: next.x, y: next.y, dir: chosen };
      });

      renderEntities();
      handleCollision(now);
    }

    function loadLevel(levelIndex, nextLives = state.lives, nextTotalCollected = state.totalCollected) {
      const fresh = buildLevel(levelIndex);
      state.levelIndex = levelIndex;
      state.grid = fresh.grid;
      state.player = fresh.player;
      state.ghosts = fresh.ghosts;
      state.totalHearts = fresh.totalHearts;
      state.collected = 0;
      state.totalCollected = nextTotalCollected;
      state.lives = nextLives;
      state.running = false;
      state.status = 'ready';
      state.direction = 'right';
      state.desiredDirection = 'right';
      state.boostEndAt = 0;
      state.boostMsLeft = 0;
      state.playerAccumulator = 0;
      state.ghostAccumulator = 0;
      renderAll(true);
    }

    function resetGame() {
      state.totalCollected = 0;
      state.lives = INITIAL_LIVES;
      loadLevel(0, INITIAL_LIVES, 0);
    }

    function queueDirection(dirName) {
      state.desiredDirection = dirName;
      if (canMove(state.grid, state.player, dirName)) state.direction = dirName;
    }

    function startOrPause() {
      if (['lost', 'gameWon', 'levelWon'].includes(state.status)) return;
      state.running = !state.running;
      state.status = 'playing';
      state.lastFrame = performance.now();
      renderMessage();
    }

    function goToNextLevel() {
      if (state.levelIndex < LEVELS.length - 1) {
        loadLevel(state.levelIndex + 1, state.lives, state.totalCollected);
      }
    }

    function gameLoop(now) {
      if (!state.lastFrame) state.lastFrame = now;
      const delta = Math.min(40, now - state.lastFrame);
      state.lastFrame = now;

      syncBoostDisplay(now);

      if (state.running && state.status === 'playing') {
        state.playerAccumulator += delta;
        state.ghostAccumulator += delta;

        const playerStepMs = PLAYER_SPEEDS[state.levelIndex] || PLAYER_SPEEDS[PLAYER_SPEEDS.length - 1];
        const ghostStepMs = GHOST_SPEEDS[state.levelIndex] || GHOST_SPEEDS[GHOST_SPEEDS.length - 1];

        let safety = 0;
        while (state.playerAccumulator >= playerStepMs && state.running && state.status === 'playing' && safety < 3) {
          state.playerAccumulator -= playerStepMs;
          stepPlayer(now);
          safety += 1;
        }

        safety = 0;
        while (state.ghostAccumulator >= ghostStepMs && state.running && state.status === 'playing' && safety < 3) {
          state.ghostAccumulator -= ghostStepMs;
          stepGhosts(now);
          safety += 1;
        }
      }

      requestAnimationFrame(gameLoop);
    }

    let touchStart = null;

    els.playBtn.addEventListener('click', startOrPause);
    els.resetBtn.addEventListener('click', resetGame);
    els.nextLevelBtn.addEventListener('click', goToNextLevel);
    els.controlBtns.forEach(btn => {
      btn.addEventListener('click', () => queueDirection(btn.dataset.dir));
    });

    window.addEventListener('keydown', (event) => {
      if (!['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(event.key)) return;
      event.preventDefault();
      if (event.key === 'ArrowUp') queueDirection('up');
      if (event.key === 'ArrowDown') queueDirection('down');
      if (event.key === 'ArrowLeft') queueDirection('left');
      if (event.key === 'ArrowRight') queueDirection('right');
    }, { passive: false });

    els.boardShell.addEventListener('touchstart', (event) => {
      const touch = event.touches[0];
      touchStart = { x: touch.clientX, y: touch.clientY };
    }, { passive: true });

    els.boardShell.addEventListener('touchend', (event) => {
      if (!touchStart) return;
      const touch = event.changedTouches[0];
      const dx = touch.clientX - touchStart.x;
      const dy = touch.clientY - touchStart.y;
      const absX = Math.abs(dx);
      const absY = Math.abs(dy);
      if (Math.max(absX, absY) < 18) return;
      if (absX > absY) queueDirection(dx > 0 ? 'right' : 'left');
      else queueDirection(dy > 0 ? 'down' : 'up');
      touchStart = null;
    }, { passive: true });

    loadLevel(0, INITIAL_LIVES, 0);
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
